<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kazhin & Hiwa</title>
<meta name="description" content="مارەبڕینی کەژین و هیوا · ٢١ی تشرینی دووەمی ٢٠٢٦">
<meta property="og:title" content="کەژین & هیوا · مارەبڕین">
<meta property="og:description" content="٢١ی تشرینی دووەمی ٢٠٢٦ · کاتژمێر ٧ی ئێوارە · تانجەڕۆ">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f5ebe6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500&family=Noto+Naskh+Arabic:wght@500;600&family=Amiri:wght@400&family=Pinyon+Script&family=Cormorant+Garamond:wght@500&display=block" rel="stylesheet">
<style>
/* VOICE: tender, festive, airy
   IDEA: a sealed letter with a wax seal, opened into a flowered card
   PICTURE: blush envelope + plum wax seal; a rose wreath framing the names
   COLOUR and TYPE: blush ground, deep plum ink, rose-gold accent, sage leaves; Noto Naskh + Vazirmatn + Pinyon Script
   LAYOUT: full-screen chapters, one centred column, soft paper cards */
:root{color-scheme:light;--bg:#f5ebe6;--paper:#fffaf7;--plum:#4b1d3f;--rose:#b5677a;--rg:#c08a6e;--sage:#8a9a7b;--ink:#3a2433;--mute:#8b7680;--line:rgba(181,103,122,.28)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;overflow-x:hidden;width:100%}
#petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
body{margin:0;opacity:0;transition:opacity .5s;background:var(--bg);color:var(--ink);font:17px/1.9 Vazirmatn,system-ui,sans-serif;overflow-x:clip;text-align:center}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,rgba(181,103,122,.10),transparent 40%),radial-gradient(circle at 90% 85%,rgba(138,154,123,.14),transparent 45%)}
body.ready{opacity:1}
.wreath>svg{will-change:transform}
.scr{font-family:'Pinyon Script',cursive;font-weight:400}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 22px 110px;position:relative}
.wrap{width:100%;max-width:560px;position:relative}
.eyebrow{color:var(--rose);font-size:17px;margin:0 0 12px}
h1,h2{font:600 clamp(28px,7vw,40px)/1.4 'Noto Naskh Arabic',serif;margin:0;color:var(--plum);text-wrap:balance}
.sep{width:120px;height:20px;margin:22px auto;display:block}
.card{background:var(--paper);border-radius:28px;padding:42px 26px;margin:0 0 22px;box-shadow:0 1px 0 #fff inset,0 18px 40px -18px rgba(75,29,63,.28);position:relative;border:1px solid rgba(255,255,255,.7)}
.card::after{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:20px;pointer-events:none}
.ini{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--plum);color:#f5ebe6;font:400 52px/1 'Pinyon Script',cursive;box-shadow:0 0 0 6px var(--paper),0 0 0 7px var(--line)}
.pill{display:inline-block;background:rgba(181,103,122,.12);color:var(--rose);border-radius:30px;padding:2px 20px;font-size:15px;margin-top:8px}
.btn{display:inline-block;border-radius:40px;padding:14px 32px;font:inherit;font-size:17px;cursor:pointer;text-decoration:none;min-height:50px;margin:6px 4px}
.btn.fill{background:var(--plum);color:#fff;border:0;box-shadow:0 10px 24px -10px rgba(75,29,63,.6)}
.btn.out{background:transparent;color:var(--plum);border:1.5px solid var(--plum)}
.btn:focus-visible,.ic:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
/* controls */
.top{direction:ltr;position:fixed;top:0;inset-inline:0;display:flex;justify-content:space-between;padding:16px 18px;z-index:5;pointer-events:none}
.top>div{display:flex;gap:10px}
.ic{pointer-events:auto;width:52px;height:52px;border-radius:50%;background:rgba(255,250,247,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--plum);display:grid;place-items:center;cursor:pointer;font:600 15px/1 system-ui;box-shadow:0 6px 16px -8px rgba(75,29,63,.4)}
.ic svg{width:20px;height:20px;fill:currentColor}
.bar{position:fixed;top:0;inset-inline-start:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--rg));width:0;z-index:6}
/* envelope gate */
#gate{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:20px;transition:opacity 1s .9s,visibility 1s .9s}
#gate.open{opacity:0;visibility:hidden}
.env{position:relative;width:min(84vw,340px);aspect-ratio:1.45;perspective:900px;cursor:pointer;border:0;background:none;padding:0}
.env .back{position:absolute;inset:0;background:#e9cfc6;border-radius:10px;box-shadow:0 30px 50px -24px rgba(75,29,63,.5)}
.env .letter{position:absolute;inset:8% 7% 6%;background:var(--paper);border-radius:6px;display:grid;place-items:center;color:var(--plum);font:400 36px/1 'Pinyon Script',cursive;transition:transform 1s .45s cubic-bezier(.2,.8,.2,1)}
.env .front{position:absolute;inset:0;background:linear-gradient(160deg,#efd9d1,#e5c3b8);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:10px}
.env .flap{position:absolute;inset:0 0 auto;height:62%;background:linear-gradient(#e3bfb3,#dcb3a6);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;border-radius:10px 10px 0 0;z-index:2}
.seal{position:absolute;left:50%;top:58%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;z-index:3;background:radial-gradient(circle at 35% 30%,#7a3466,#4b1d3f 65%);color:#f0d9cf;display:grid;place-items:center;font:400 26px/1 'Pinyon Script',cursive;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 0 0 5px rgba(255,255,255,.08);transition:opacity .4s,transform .4s}
#gate.open .seal{opacity:0;transform:scale(.6)}
#gate.open .flap{transform:rotateX(180deg);z-index:0}
#gate.open .letter{transform:translateY(-46%)}
#gate p{margin:0;color:var(--plum);font:600 22px 'Noto Naskh Arabic',serif}
#gate small{color:var(--rose);font-size:16px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.45}}
/* hero */
.wreath{width:min(92vw,470px);aspect-ratio:1;position:relative;display:grid;place-items:center}
.wreath>svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.names{font:600 clamp(40px,12vw,60px)/1.25 'Noto Naskh Arabic',serif;color:var(--plum);margin:0}
.amp{font:400 clamp(40px,11vw,54px)/1 'Pinyon Script',cursive;color:var(--rose);display:block;margin:2px 0 6px}
.when{display:inline-block;margin-top:24px;background:var(--paper);border-radius:40px;padding:8px 22px;font-size:clamp(15px,4.2vw,18px);color:var(--ink);box-shadow:0 8px 20px -12px rgba(75,29,63,.35)}
.down{position:absolute;bottom:28px;color:var(--rose);font-size:15px;text-decoration:none}
.down b{display:block;font-size:22px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.petal{position:absolute;top:-30px;width:14px;height:14px;border-radius:14px 0;background:var(--rose);opacity:.35;pointer-events:none;animation:fall linear forwards;z-index:1}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
/* couple */
.couple{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.couple .card{margin:0;padding:34px 14px}
.couple .amp{font-size:44px}
.couple h2{font-size:clamp(24px,6.5vw,34px)}
@media(max-width:420px){.couple{grid-template-columns:1fr}.couple .amp{margin:4px 0}}
/* invite */
.ayah{font:400 clamp(25px,6.6vw,34px)/2 Amiri,serif;color:var(--plum);margin:0}
.src{color:var(--mute);font-size:15px;margin:8px 0 0}
.inv{font-size:clamp(19px,5vw,23px);line-height:2.1;margin:0;color:var(--ink)}
.sig{font:600 28px 'Noto Naskh Arabic',serif;color:var(--plum)}
.sig i{font:400 32px 'Pinyon Script',cursive;color:var(--rose);margin:0 12px;font-style:normal}
/* details */
.dl{display:grid;gap:14px}
.dc{display:flex;align-items:center;gap:18px;text-align:start;padding:22px 24px;margin:0}
.dc::after{inset:7px;border-radius:22px}
.dc .ico{flex:none;width:58px;height:58px;border-radius:18px;background:rgba(181,103,122,.12);display:grid;place-items:center}
.dc svg{width:30px;height:30px;stroke:var(--rose);fill:none;stroke-width:1.7;stroke-linecap:round}
.dc small{display:block;color:var(--mute);font-size:15px;line-height:1.4}
.dc strong{font:600 clamp(19px,5vw,23px)/1.5 'Noto Naskh Arabic',serif;color:var(--plum)}
/* map */
.mapbox{border-radius:28px;overflow:hidden;margin:26px 0 20px;box-shadow:0 18px 40px -18px rgba(75,29,63,.35)}
.mapbox svg{display:block;width:100%;height:auto}
/* countdown */
.cd{direction:ltr;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:30px 0 22px}
.cd div{background:var(--plum);color:#fff;border-radius:22px;padding:20px 4px 12px;box-shadow:0 14px 28px -14px rgba(75,29,63,.7)}
.cd b{display:block;font:500 clamp(34px,10vw,50px)/1 'Cormorant Garamond',serif}
.cd span{font-size:14px;opacity:.75}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(40px);opacity:0;background:var(--plum);color:#fff;padding:10px 22px;border-radius:30px;transition:.4s;z-index:20;font-size:15px;max-width:90vw;overflow-wrap:anywhere}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s,transform 1s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.wreath>svg,.down b,#gate small{animation:none}.petal{display:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="rose"><circle r="13" fill="#d9a0ad"/><circle r="9" fill="#c27e8f"/><path d="M-5 0a5 5 0 0 1 10 0a3 3 0 0 1-6 0" stroke="#9c5469" stroke-width="2" fill="none"/></g>
    <g id="bud"><circle r="6" fill="#ecc9c2"/><circle r="3" fill="#d9a0ad"/></g>
    <path id="leaf" d="M0 0C6-8 18-8 24 0C18 8 6 8 0 0z" fill="#8a9a7b"/>
    <g id="divider"><path d="M10 10H48M72 10h38" stroke="#b5677a" stroke-width="1" opacity=".5"/><use href="#leaf" transform="translate(48 10) scale(.45)"/><use href="#leaf" transform="translate(72 10) scale(.45) rotate(180)"/><circle cx="60" cy="10" r="4" fill="#b5677a"/></g>
  </defs>
</svg>

<div class="bar" id="bar"></div>

<div id="gate">
  <button class="env" id="open" aria-label="Open">
    <span class="back"></span>
    <span class="letter">K &amp; H</span>
    <span class="front"></span>
    <span class="flap"></span>
    <span class="seal">K&amp;H</span>
  </button>
  <p data-k="gateT"></p>
  <small data-k="open"></small>
</div>

<div class="top">
  <div><button class="ic" id="share" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg></button></div>
  <div><button class="ic" id="lang">EN</button><button class="ic" id="music" aria-label="Music"><svg viewBox="0 0 24 24" id="mIcon"></svg></button></div>
</div>

<section id="ayah">
  <div class="wrap">
    <p class="ayah" style="font-size:clamp(30px,9.5vw,56px);white-space:nowrap">﴿ وَخَلَقْنَاكُمْ أَزْوَاجًا ﴾</p>
    <p class="src" data-k="sura2"></p>
    <svg class="sep" viewBox="0 0 120 20"><use href="#divider"/></svg>
  </div>
  <a class="down" href="#hero"><span data-k="scroll"></span><b>↓</b></a>
</section>

<section id="hero">
  <div class="wreath">
    <svg viewBox="0 0 400 400" id="wr"></svg>
    <div>
      <p class="eyebrow" data-k="type"></p>
      <h1 class="names" data-k="bride"></h1>
      <span class="amp">&amp;</span>
      <h1 class="names" data-k="groom"></h1>
    </div>
  </div>
  <span class="when" data-k="when"></span>
  <a class="down" href="#couple"><span data-k="scroll"></span><b>↓</b></a>
</section>

<section id="couple">
  <div class="wrap">
    <p class="eyebrow" data-k="cpl"></p>
    <h2 data-k="cplH" style="margin-bottom:30px"></h2>
    <div class="couple rv">
      <div class="card"><div class="ini">K</div><h2 data-k="bride"></h2><span class="pill" data-k="brideL"></span></div>
      <span class="amp">&amp;</span>
      <div class="card"><div class="ini">H</div><h2 data-k="groom"></h2><span class="pill" data-k="groomL"></span></div>
    </div>
  </div>
</section>

<section id="invite">
  <div class="wrap">
    <div class="card rv">
      <p class="eyebrow" data-k="invT"></p>
      <p class="inv" data-k="inv"></p>
      <svg class="sep" viewBox="0 0 120 20"><use href="#divider"/></svg>
      <div class="sig"><span data-k="bride"></span><i>&amp;</i><span data-k="groom"></span></div>
    </div>
  </div>
</section>

<section id="details">
  <div class="wrap">
    <p class="eyebrow" data-k="detT"></p>
    <h2 data-k="wait" style="margin-bottom:28px"></h2>
    <div class="dl rv">
      <div class="card dc"><span class="ico"><svg viewBox="0 0 48 48"><circle cx="18" cy="29" r="10"/><circle cx="30" cy="29" r="10"/><path d="M26 12l4-5 4 5-4 4z"/></svg></span><div><small data-k="kindL"></small><strong data-k="type"></strong></div></div>
      <div class="card dc"><span class="ico"><svg viewBox="0 0 48 48"><rect x="7" y="10" width="34" height="31" rx="5"/><path d="M7 19h34M16 6v8M32 6v8"/></svg></span><div><small data-k="dateL"></small><strong data-k="date"></strong></div></div>
      <div class="card dc"><span class="ico"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><path d="M24 14v10l7 5"/></svg></span><div><small data-k="timeL"></small><strong data-k="time"></strong></div></div>
      <div class="card dc"><span class="ico"><svg viewBox="0 0 48 48"><path d="M24 42c-9-10-14-17-14-24a14 14 0 0 1 28 0c0 7-5 14-14 24z"/><circle cx="24" cy="18" r="5"/></svg></span><div><small data-k="locT"></small><strong data-k="loc"></strong></div></div>
    </div>
  </div>
</section>

<section id="place">
  <div class="wrap">
    <p class="eyebrow" data-k="locT"></p>
    <h2 data-k="loc"></h2>
    <p style="color:var(--mute);margin:6px 0 0" data-k="addr"></p>
    <div class="mapbox rv">
      <svg viewBox="0 0 400 280" role="img" aria-label="Map">
        <rect width="400" height="280" fill="#fbf3ef"/>
        <path d="M0 0h400v80C300 110 240 60 140 90S30 120 0 110z" fill="#e7ede0"/>
        <g stroke="#ecdcd5" stroke-width="10" fill="none" stroke-linecap="round"><path d="M-10 200 410 150M90 -10 150 290M300 -10 260 290"/></g>
        <path d="M-10 230C90 200 170 240 250 205S360 160 410 175" stroke="#e3c3b8" stroke-width="16" fill="none"/>
        <circle cx="200" cy="150" r="52" fill="rgba(181,103,122,.12)"/><circle cx="200" cy="150" r="28" fill="rgba(181,103,122,.15)"/>
        <path d="M200 178c-17-21-27-35-27-48a27 27 0 0 1 54 0c0 13-10 27-27 48z" fill="#4b1d3f"/>
        <circle cx="200" cy="130" r="9" fill="#f5ebe6"/>
        <rect x="140" y="194" width="120" height="34" rx="17" fill="#fff"/>
        <text x="200" y="217" text-anchor="middle" fill="#4b1d3f" font-size="16" font-family="Vazirmatn,sans-serif" id="mapLbl"></text>
      </svg>
    </div>
    <a class="btn fill" href="https://maps.app.goo.gl/gLvG2mjwkMG3R5xY9" target="_blank" rel="noopener" data-k="gmap"></a>
    <a class="btn out" href="https://waze.com/ul/htn264jbbh" target="_blank" rel="noopener" data-k="waze"></a>
  </div>
</section>

<section id="count">
  <div class="wrap">
    <p class="eyebrow" data-k="cdT"></p>
    <h2 id="cdMsg"></h2>
    <div class="cd"><div><b id="d">00</b><span data-k="d"></span></div><div><b id="h">00</b><span data-k="h"></span></div><div><b id="m">00</b><span data-k="m"></span></div><div><b id="s">00</b><span data-k="s"></span></div></div>
    <p style="color:var(--mute)" data-k="date"></p>
  </div>
</section>

<section id="thanks">
  <div class="wrap">
    <p class="eyebrow" data-k="thxT"></p>
    <h2 data-k="thx"></h2>
    <svg class="sep" viewBox="0 0 120 20"><use href="#divider"/></svg>
    <p class="names" style="font-size:clamp(34px,10vw,48px)"><span data-k="bride"></span> <span class="amp" style="display:inline;font-size:.9em">&amp;</span> <span data-k="groom"></span></p>
    <div style="margin-top:22px"><button class="btn out" id="copy" data-k="copy"></button>
    <a class="btn fill" href="#ayah" data-k="topB"></a></div>
  </div>
</section>

<div id="petals"></div>
<div class="toast" id="toast"></div>

const target=new Date('2026-11-21T19:00:00+03:00').getTime();

/* recitation audio: blob URL for <audio>, Web Audio as fallback */
let playing=false,ac=null,buf=null,srcNode=null,mode='el';
const aud=$('aud');
const b64=document.getElementById('snd').textContent.trim();
const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
try{aud.src=URL.createObjectURL(new Blob([bin],{type:'audio/mpeg'}));aud.load()}catch(e){mode='wa'}
function waPlay(){try{
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  ac.resume();
  const go=()=>{if(srcNode)try{srcNode.stop()}catch(e){}srcNode=ac.createBufferSource();srcNode.buffer=buf;srcNode.loop=true;srcNode.connect(ac.destination);srcNode.start(0);playing=true;setIcon()};

}catch(e){}}
function startMusic(fromStart){
  if(mode==='wa'){waPlay();return}
  aud.volume=1;if(fromStart)try{aud.currentTime=0}catch(e){}

  const p=aud.play();
  if(p&&p.catch)p.catch(()=>{mode='wa';waPlay()});
}
function stopMusic(){playing=false;if(mode==='wa'){try{ac.suspend()}catch(e){}}else aud.pause();setIcon()}
function setIcon(){$('mIcon').innerHTML=playing?'<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>':'<path d="M8 5v14l11-7z"/>'}
$('music').onclick=()=>{if(playing)stopMusic();else if(mode==='wa'&&buf&&ac){ac.resume();playing=true;setIcon()}else startMusic()};
/* petals */
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function petal(){if(calm||document.hidden)return;const p=document.createElement('span');p.className='petal';const s=8+Math.random()*10;
  p.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s}px;--dx:${(Math.random()-.5)*160}px;animation-duration:${8+Math.random()*6}s;background:${Math.random()<.3?'#8a9a7b':'#d9a0ad'}`;
  $('petals').appendChild(p);setTimeout(()=>p.remove(),15000)}
$('open').onclick=()=>{$('gate').classList.add('open');if(!playing)startMusic(true);for(let i=0;i<10;i++)setTimeout(petal,i*250);setInterval(petal,1600)};
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2400)}
async function copyLink(){const u=location.href.split('#')[0];try{await navigator.clipboard.writeText(u);toast(T[L].copied)}catch(e){toast(u)}}
$('copy').onclick=copyLink;$('share').onclick=copyLink;
addEventListener('scroll',()=>{const h=document.documentElement;$('bar').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
setIcon();apply();
{const show=()=>document.body.classList.add('ready');(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(show);setTimeout(show,1500)}
/* voice from the first moment: try autoplay, else start on the very first touch anywhere */
let armed=true;
function firstTouch(){if(!armed)return;armed=false;if(!playing)startMusic(true);['pointerdown','touchstart','keydown','click'].forEach(ev=>removeEventListener(ev,firstTouch,true))}
['pointerdown','touchstart','keydown','click'].forEach(ev=>addEventListener(ev,firstTouch,{capture:true,passive:true}));
addEventListener('load',()=>{try{aud.currentTime=0;const p=aud.play();if(p&&p.then)p.then(()=>{playing=true;armed=false;setIcon()}).catch(()=>{playing=false;setIcon()})}catch(e){}});
}
